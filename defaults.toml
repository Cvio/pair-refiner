# The default model settings. Any run can change them (in the dashboard, from M7). Model ids are OpenRouter's.
#
# Decided by the M6 test run (2026-10-19; docs/adr/0005): on FLORES+ the panel did not beat the best single
# translator in either direction, so by default each direction uses its best single translator, and one judge
# (the best measured, GPT-6.1 Sol) only when there are two different candidates, e.g. a dataset's own translation.
#
# meta/muse-wonder is out for now (2026-10-19, user's choice): during the M6 test run Meta blocked this account
# ("Your access has been restricted due to repeated policy violations") after its filter silently refused
# FLORES+ medical sentences. Put it back only once the block is lifted.

[directions.en-fa]
# Google Translate: chrF 58.1 on FLORES+, the best of all, but it can't be told written or spoken (seen in M8).
# Gemini 4 Argon: the best AI model on FLORES+ (53.4), and it follows the register. GPT-6.1 Sol judges
# between them with the register in mind (2026-10-20, user's choice; docs/adr/0005).
translators = ["google-translate", "google/gemini-4-argon"]
judges = ["openai/gpt-6.1-sol"]
top_judge = "openai/gpt-6.1-sol"
back_translation = true                      # by Gemini when Google wins, by GPT-6.1 Sol when Gemini wins
chrf_threshold = 49.9                        # flagged 6% of FLORES+ sentences

[directions.fa-en]
translators = ["anthropic/claude-opus-5.5"]  # chrF 75.0 on FLORES+, the best of all
judges = ["openai/gpt-6.1-sol"]
top_judge = "openai/gpt-6.1-sol"
back_translation = false                     # back into Persian scores low on chrF: a threshold would flag half

# Tidies a source sentence's punctuation and capitals, for datasets with tidy_source = true (docs/adr/0006).
# The words must come back unchanged, or the original is kept. GPT-6.1 Sol got all 7 of MIZAN's untidy examples
# right (about $0.0006 a sentence); DeepSeek kept an unpaired opening quote; Gemini capitalised a fragment.
[tidy]
model = "openai/gpt-6.1-sol"

# The panel measured by the M6 test run (flores_run.py), kept to re-run it, e.g. once Meta's block is lifted.
[panel]
translators = [
    "anthropic/claude-opus-5.5",
    "openai/gpt-6.1-sol",
    "google/gemini-4-argon",
    "deepseek/deepseek-v4-pro-0813",
    "google-translate",
]
# Google Translate can't judge.
judges = [
    "anthropic/claude-opus-5.5",
    "openai/gpt-6.1-sol",
    "google/gemini-4-argon",
    "deepseek/deepseek-v4-pro-0813",
]
