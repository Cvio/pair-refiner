[project]
name = "pair-refiner"
version = "0.1.0"
description = "Translate sentence datasets with several AI models, judge the translations blind, and keep the best as training pairs."
readme = "README.md"
authors = [
    { name = "cvio", email = "steven.robbins.000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "sacrebleu>=2.6.0",
]

[project.scripts]
pair-refiner = "pair_refiner.dashboard:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=9.1.1",
]

[tool.uv]
# The repo is on D: and uv's cache is on C:, so files can't be hard-linked; copy them quietly.
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live check (seam 8) spends real money, so the normal run skips it.
# Run it by hand with: uv run pytest -m live
addopts = '--strict-markers -m "not live"'
markers = [
    "live: talks to the real models and costs a few cents; run only by hand",
]
